# =============================================================================
# Docker Compose - Frontend SSR Node + Backend (.NET) come servizi separati.
#
# DEV (automatico):
#   docker compose up
#   -> Applica docker-compose.override.yml: Angular dev server + backend in Development.
#
# PROD (stesso host):
#   docker compose -f docker-compose.yml up -d --build
#
# PROD (backend esposto sull'host, es. API pubbliche o deploy separato):
#   docker compose -f docker-compose.yml -f docker-compose.backend-exposed.yml up -d --build
#
# NOTA: specificare -f docker-compose.yml esclude docker-compose.override.yml (dev).
#
# La configurazione proviene da br1engine.json, montato in entrambi i container.
# Frontend e backend leggono direttamente il file JSON alla loro avvio.
# deploy.sh legge br1engine.json per le poche variabili necessarie a docker-compose
# (porta host, project name) e le passa come variabili d'ambiente inline.
# =============================================================================

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        FRONTEND_BASE_URL: "${FRONTEND_BASE_URL:-}"
    environment:
      BACKEND_ORIGIN: "http://backend:8080"
      BR1_SETTINGS_PATH: /app/br1engine.json
    ports:
      - "${FRONTEND_PORT:?ERRORE: impostare frontend.port in br1engine.json}:${FRONTEND_PORT}"
    volumes:
      - ./br1engine.json:/app/br1engine.json:ro
    depends_on:
      backend:
        condition: service_healthy
        required: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./br1engine.json:/app/br1engine.json:ro
      - uploads-data:/app/uploads
      - db-data:/app/db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  uploads-data:
    driver: local
  db-data:
    driver: local
