<button class="action-btn d-inline-flex align-items-center gap-2"
        type="button"
        [disabled]="loading()"
        [attr.aria-busy]="loading() || null"
        [title]="displayLabel()"
        [attr.aria-label]="showLabel() ? null : displayLabel()"
        (click)="onClick()">
    @if (loading()) {
        <span class="spinner-border spinner-border-sm action-icon" aria-hidden="true"></span>
    } @else {
        <i class="fa-solid fa-download action-icon" aria-hidden="true"></i>
    }
    @if (showLabel()) {
        <span>{{ displayLabel() }}</span>
    }
</button>
