<button class="action-btn d-inline-flex align-items-center gap-2"
        type="button"
        (click)="onClick()"
        [title]="displayLabel()"
        [attr.aria-label]="showLabel() ? null : displayLabel()">
    <i class="fa-solid fa-copy action-icon" aria-hidden="true"></i>
    @if (showLabel()) {
        <span>{{ displayLabel() }}</span>
    }
</button>
