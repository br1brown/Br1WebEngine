version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ["@angular/*", "@angular-eslint/*"]
      dev-tools:
        patterns: ["eslint*", "karma*", "jasmine*", "typescript", "lighthouse", "pa11y"]

  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
